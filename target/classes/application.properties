spring.application.name=ayurvedic-medicine-api
server.port=8080

# H2 embedded database — file-based persistence, zero MySQL required
spring.datasource.url=jdbc:h2:file:./data/ayurvedadb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT — 64-character secret
app.jwt.secret=AyurVedaCare2026SecureJwtSecretKeyThatIsAtLeast64CharactersLongForHS256
app.jwt.expiration-ms=86400000

# CORS — allowed dev origins
app.cors.allowed-origin=http://localhost:5173
